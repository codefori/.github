on:
  workflow_call:
    inputs:
      publish_types:
        required: false
        default: false
        type: boolean

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  release:
    name: Release and publish

    runs-on: ubuntu-latest

    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install dependencies
        run: npm ci

      - name: Update version number
        run: npm version --allow-same-version --no-git-tag-version ${{ github.ref_name }}

      - name: Get package info
        id: package-info
        uses: luizfelipelaviola/get-package-info@v2
        with:
          path: .

      - name: Package
        run: npx @vscode/vsce package --allow-package-all-secrets

      - name: Generate and publish types
        if: ${{ inputs.publish_types }}
        run: |
          cd types
          npm version --allow-same-version --no-git-tag-version ${{ github.ref_name }}
          cd ..
          npm run types
          cd types
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


      - name: Publish on VS Code marketplace
        run: npx @vscode/vsce publish --skip-duplicate --packagePath ${{ steps.package-info.outputs.name }}-${{ steps.package-info.outputs.version}}.vsix --pat ${{ secrets.PUBLISHER_TOKEN }}

      - name: Publish on Open VSX
        run: npx ovsx publish --skip-duplicate --packagePath ${{ steps.package-info.outputs.name }}-${{ steps.package-info.outputs.version}}.vsix --pat ${{ secrets.OPENVSX_TOKEN }}

      - name: Attach vsix
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          asset_name: ${{ steps.package-info.outputs.name }}-${{ github.ref_name }}.vsix
          file: ${{ steps.package-info.outputs.name }}-${{ github.ref_name }}.vsix

      - name: Commit changes and move release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -a -m "Release ${{ github.ref_name }}"
          git tag -f ${{ github.ref_name }}
          git push --tags --force

      - name: Bump version numbers for next cycle
        run: npm version --no-git-tag-version prerelease --preid dev

      - name: Bump types version numbers for next cycle
        if: ${{ inputs.publish_types }}
        run: cd types && npm version --no-git-tag-version prerelease --preid dev

      - name: Read new version
        id: new-version
        uses: beaconbrigade/package-json-version@v0.3

      - name: Commit version number change
        run: |
          git commit -a -m "Starting ${{ steps.new-version.outputs.version }} development"
          git push
