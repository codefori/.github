on:
  workflow_call:
    inputs:
      publish_types:
        required: false
        default: false
        type: boolean
      is_prerelease:
        required: false
        default: false
        type: boolean  

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  release:
    name: Release and publish

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Update version number for prelease
        if: ${{ inputs.is_prerelease }}
        run: npm version --no-git-tag-version patch

      - name: Update version number for release
        if: ${{ ! inputs.is_prerelease }}
        run: npm version --allow-same-version --no-git-tag-version ${{ github.ref_name }}

      - name: Get package info
        id: package-info
        uses: luizfelipelaviola/get-package-info@v2
        with:
          path: .

      - name: Read version
        id: tag-version
        uses: beaconbrigade/package-json-version@v0.3

      - env:
          PRERELEASE: ""
          TYPE_LABEL: "Release"

      - if: ${{ inputs.is_prerelease }}
        env:
          PRERELEASE: "--pre-release"
          TYPE_LABEL: "Pre-release"

      - name: Package $TYPE_LABEL
        run: npx @vscode/vsce package $PRERELEASE --allow-package-all-secrets

      - name: Generate types
        if: ${{ inputs.publish_types }}
        run: |
          cd types
          npm version --allow-same-version --no-git-tag-version ${{ steps.tag-version.outputs.current-version}}
          cd ..
          npm run types
      
      - name: Publish types
        if: ${{ inputs.publish_types }}
        working-directory: types
        run: npm publish --access public

      - name: Publish on VS Code marketplace
        run: npx @vscode/vsce publish --oidc --skip-duplicate --packagePath ${{ steps.package-info.outputs.name }}-${{ steps.package-info.outputs.version}}.vsix

      - name: Publish on Open VSX
        run: npx ovsx publish --trusted-publishing --skip-duplicate --packagePath ${{ steps.package-info.outputs.name }}-${{ steps.package-info.outputs.version}}.vsix

      - name: Attach vsix
        if: ${{ ! inputs.is_prerelease }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          asset_name: ${{ steps.package-info.outputs.name }}-${{ github.ref_name }}.vsix
          file: ${{ steps.package-info.outputs.name }}-${{ github.ref_name }}.vsix

      - name: Commit changes and move release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -a -m "$TYPE_LABEL ${{ steps.tag-version.outputs.current-version}}"
          git tag -f ${{ steps.tag-version.outputs.current-version}}
          git push --tags --force

      - name: Bump version numbers for next cycle
        run: npm version --no-git-tag-version prerelease --preid dev

      - name: Bump types version numbers for next cycle
        if: ${{ inputs.publish_types }}
        run: cd types && npm version --no-git-tag-version prerelease --preid dev

      - name: Read new version
        id: new-version
        uses: beaconbrigade/package-json-version@v0.3

      - name: Commit version number change
        run: |
          git commit -a -m "Starting ${{ steps.new-version.outputs.version }} development"
          git push
