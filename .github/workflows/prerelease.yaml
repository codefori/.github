on:
  workflow_call:
    inputs:
      publish_types:
        required: false
        default: false
        type: boolean

jobs:
  publish_prerelease:
    runs-on: ubuntu-latest

    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install dependencies
        run: npm ci

      - name: Update version number for prelease
        run: npm version --no-git-tag-version patch

      - name: Get package info
        id: package-info
        uses: luizfelipelaviola/get-package-info@v2
        with:
          path: .

      - name: Update version number for types
        if: ${{ inputs.publish_types }}
        run: cd types && npm version --no-git-tag-version patch

      - name: Package
        run: npx @vscode/vsce package --pre-release --allow-package-all-secrets

      - name: Publish on VS Code marketplace
        run: npx @vscode/vsce publish --skip-duplicate --packagePath ${{ steps.package-info.outputs.name }}-${{ steps.package-info.outputs.version}}.vsix --pat ${{ secrets.PUBLISHER_TOKEN }}

      - name: Publish on Open VSX
        run: npx ovsx publish --skip-duplicate --packagePath ${{ steps.package-info.outputs.name }}-${{ steps.package-info.outputs.version}}.vsix --pat ${{ secrets.OPENVSX_TOKEN }}

      - name: Bump version number for next dev cycle
        run: npm version --no-git-tag-version prerelease --preid dev

      - name: Bump version number for next dev cycle
        if: ${{ inputs.publish_types }}
        run: cd types && npm version --no-git-tag-version prerelease --preid dev

      - name: get-npm-version
        id: devcycle-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Commit version bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -a -m "Pre-release ${{ steps.devcycle-version.outputs.current-version}}"
          git push